
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>letter.html</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,
body{
width:100%;
height:100%;
}

body{

margin:0;

font-family:"Itim",cursive;

display:flex;
justify-content:center;
align-items:center;

padding:20px;

overflow:hidden;

background:linear-gradient(
135deg,
#F7F5FF,
#EEE9FF,
#F8F6FF,
#E7E1FF
);

position:relative;

opacity:1;
transition:opacity .4s ease;

}
.blur,
.blur2{

position:fixed;

border-radius:50%;

filter:blur(180px);

opacity:.22;

pointer-events:none;

z-index:0;

}
.blur{width:520px;height:520px;left:-140px;top:-140px;background:#A78BFA}
.blur2{width:480px;height:480px;right:-140px;bottom:-140px;background:#C4B5FD}
.card{

position:relative;

z-index:5;

width:100%;

max-width:420px;

padding:36px;

background:rgba(255,255,255,.6);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.75);

border-radius:28px;

text-align:center;

box-shadow:0 20px 50px rgba(110,90,220,.15);

animation:fade .8s ease;

}
@keyframes fade{
from{opacity:0;transform:translateY(20px) scale(.96)}
to{opacity:1;transform:none}
}
.icon{font-size:58px}
h2{
margin:12px 0 20px;
font-size:32px;
color:#5E67D9;
}
input{
width:100%;
padding:15px;
border:2px solid #d8cdfd;
border-radius:16px;
font-family:"Itim",cursive;
font-size:22px;
text-align:center;
outline:none;
transition:.25s;
background:#fff;
}
input:focus{
border-color:#8B7DFF;
box-shadow:0 0 0 4px rgba(139,125,255,.15);
}
#msg{
height:28px;
margin-top:14px;
font-size:20px;
color:#ff5f8a;
}
button{
margin-top:18px;
width:100%;
padding:14px;
border:none;
border-radius:999px;
background:#8B7DFF;
color:#fff;
font-family:"Itim",cursive;
font-size:22px;
cursor:pointer;
transition:.25s;
}
button:disabled{
background:#c8c4ea;
cursor:not-allowed;
}
button:not(:disabled):hover{
transform:translateY(-2px);
}
.tip{
margin-top:10px;
font-size:16px;
color:#7b7698;
}
    @media (max-width:768px){

body{

padding:16px;

}

.card{

padding:24px 20px;

border-radius:22px;

}

.icon{

font-size:52px;

}

h2{

font-size:26px;

}

input{

font-size:20px;

padding:14px;

}

button{

font-size:20px;

padding:14px;

}

.tip{

font-size:15px;

}

}
</style>
</head>
<body>

<div class="blur"></div>
<div class="blur2"></div>

<div class="card">
<div class="icon">🔐</div>
<h2>ใส่รหัสก่อน เดี๋ยวให้ดูค่ะ</h2>

<input id="code" type="password" maxlength="6" placeholder="••••••">

<div id="msg"></div>

<button id="nextBtn" disabled onclick="goNext()">เปิดเลย! 💜</button>

<div class="tip" id="hint" style="display:none;">
    Hint: วันนี้วันที่เท่าไหร่น้าา..? 🤭
</div>

<script>
const correctCode="050869";

document.getElementById("code").addEventListener("input",checkCode);

function checkCode(){

    const val = document.getElementById("code").value.trim();
    const msg = document.getElementById("msg");
    const btn = document.getElementById("nextBtn");
    const hint = document.getElementById("hint");

    if(val.length === 0){

        msg.textContent = "";
        btn.disabled = true;
        hint.style.display = "none";
        return;

    }

    if(val === correctCode){

        msg.textContent = "เก่งมากไอมุ! 😻";
        msg.style.color = "#6B5CF5";

        btn.disabled = false;
        hint.style.display = "none";

    }else{

        msg.textContent = "รหัสผิดค้าบ ลองใหม่อีกทีน้า 🥺";
        msg.style.color = "#FF5F8A";

        btn.disabled = true;
        hint.style.display = "block";

    }

}

function goNext(){

    document.body.style.opacity = "0";

    setTimeout(function(){

        window.location.href = "our_story.html";

    },400);

}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Story</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
font-family:"Itim",cursive;
background:linear-gradient(135deg,#F7F5FF,#EEE9FF,#F8F6FF,#E7E1FF);
position:relative;
}
.blur,.blur2{position:absolute;border-radius:50%;filter:blur(180px);opacity:.22}
.blur{width:520px;height:520px;background:#A78BFA;left:-140px;top:-140px}
.blur2{width:480px;height:480px;background:#C4B5FD;right:-140px;bottom:-140px}
.card{
position:relative;
z-index:2;
width:min(90vw,780px);
padding:28px;
border-radius:28px;
background:rgba(255,255,255,.55);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.75);
box-shadow:0 20px 60px rgba(102,84,255,.15);
text-align:center;
animation:fade .8s ease;
}
@keyframes fade{
from{opacity:0;transform:translateY(20px) scale(.97)}
to{opacity:1;transform:none}
}
h1{
font-family:"Itim",cursive;
font-size:42px;
font-weight:400;
color:#5E67D9;
margin-bottom:8px;
}
.subtitle{
font-size:20px;
color:#7B77A0;
margin-bottom:22px;
}
.video-wrap{
overflow:hidden;
border-radius:22px;
box-shadow:0 12px 30px rgba(90,80,190,.18);
}
video{
display:block;
width:100%;
background:#000;
}
#next{
display:none;
margin-top:24px;
animation:fade .5s ease;
}
.btn{
display:inline-block;
padding:14px 34px;
border-radius:999px;
background:#F6B5CC;
color:#5E67D9;
text-decoration:none;
font-size:22px;
box-shadow:0 10px 24px rgba(246,181,204,.35);
transition:.25s;
}
.btn:hover{transform:translateY(-2px) scale(1.03);background:#F3A8C2}
</style>
</head>
<body>


<div class="blur"></div>
<div class="blur2"></div>

<div class="card">
<h1>Happy Anniversary 1 Year 🤍🌷</h1>
<p class="subtitle">P'Kwan rak N'Muay tee sud nai lok ♡🌍</p>



<div class="video-wrap">
    <video id="movie" controls autoplay muted>
        <source src="video/clip.mp4" type="video/mp4">
        เบราว์เซอร์ของคุณไม่รองรับการเล่นวิดีโอ
    </video>

<div id="next">
<p class="subtitle">ไปกันต่อเลยมั้ยคะ ?</p>
<a class="btn" href="menu.html">Go next 💌</a>
</div>

</div>

<script>
document.getElementById("movie").addEventListener("ended",()=>{
 document.getElementById("next").style.display="block";
});


</script>
</body>
</html>

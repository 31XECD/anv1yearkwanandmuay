    <style>

            padding: 0;
            box-sizing: border-box;
        }

        body {

                #F7F5FF,

                #F8F6FF,

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 24px;

        }

        .card {

            width: min(92vw, 760px);

            background: rgba(255,255,255,.6);

            backdrop-filter: blur(18px);

            padding: 28px;

            border-radius: 28px;

            box-shadow: 0 20px 60px rgba(98,84,220,.15);

            text-align: center;

        }

        h1 {

            color: #5E67D9;

        }

        .sub {

            color: #8A86A8;

            margin: 10px 0 20px;

            font-size: 20px;

        }

        .photo {

            width: 100%;

            aspect-ratio: 4 / 5;

            object-fit: cover;

            border-radius: 20px;

            box-shadow: 0 10px 30px rgba(0,0,0,.12);

        }

        h2 {

            margin: 18px 0 8px;

            color: #5E67D9;

        }

        p {

            color: #7B77A0;

            font-size: 18px;

        }

        .nav {

            display: flex;

            justify-content: space-between;

            margin-top: 24px;

        }

        button {

            border: none;

            background: #8B7DFF;

            color: white;

            padding: 12px 24px;

            border-radius: 999px;

            font-family: "Itim", cursive;

            font-size: 20px;

            cursor: pointer;

            transition: .25s;

        }

        button:hover {

            background: #7366E8;

            transform: translateY(-2px);

        }

        .count {

            margin-top: 18px;

            color: #9B95BA;

        }

        .back {

            display: inline-block;

            margin-top: 22px;

            text-decoration: none;

            background: #F6B5CC;

            padding: 12px 28px;

            border-radius: 999px;

            color: #5E67D9;

        }

        .back:hover {

            background: #F3A8C2;

</head>

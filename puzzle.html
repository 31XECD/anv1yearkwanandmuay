<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Puzzle</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{
width:100%;
min-height:100%;
}

body{

margin:0;

font-family:"Itim",cursive;

background:linear-gradient(
135deg,
#F7F5FF,
#EEE9FF,
#F8F6FF,
#E7E1FF
);

display:flex;
justify-content:center;
align-items:flex-start;

padding:20px;

overflow-x:hidden;
overflow-y:auto;

position:relative;

}

.blur,
.blur2{

position:fixed;

border-radius:50%;

filter:blur(180px);

opacity:.22;

pointer-events:none;

}

.blur{

width:520px;
height:520px;

background:#A78BFA;

left:-140px;
top:-140px;

}

.blur2{

width:480px;
height:480px;

background:#C4B5FD;

right:-140px;
bottom:-140px;

}

.card{

position:relative;

z-index:5;

width:100%;
max-width:720px;

margin:20px auto;

padding:28px;

background:rgba(255,255,255,.58);

backdrop-filter:blur(18px);

border-radius:28px;

text-align:center;

box-shadow:0 20px 60px rgba(100,80,220,.15);

}

h1{

color:#5E67D9;

font-size:40px;

}

p{

color:#7B77A0;

margin:12px 0 22px;

font-size:20px;

}

#board{

width:min(90vw,330px);

aspect-ratio:1;

margin:auto;

display:grid;

grid-template-columns:repeat(3,1fr);

grid-template-rows:repeat(3,1fr);

gap:3px;

}

.tile{

width:100%;

aspect-ratio:1;

background-image:url("https://img2.pic.in.th/puzzle.jpg");

background-size:300% 300%;

background-repeat:no-repeat;

border-radius:10px;

border:2px solid rgba(255,255,255,.8);

cursor:pointer;

transition:.2s;

}

.tile:hover{

transform:scale(.97);

}

.tile.selected{

border:4px solid #8B7DFF;

transform:scale(.94);

box-shadow:0 0 18px rgba(139,125,255,.45);

animation:bounce .35s;

}

@keyframes bounce{

0%{

transform:scale(.8);

}

60%{

transform:scale(1.05);

}

100%{

transform:scale(.94);

}

}

#message{

display:none;

margin-top:24px;

font-size:26px;

color:#6B5CF5;

animation:fade .4s;

}

.actions{

margin-top:20px;

}

.btn{

display:none;

padding:14px 30px;

background:#F6B5CC;

color:#5E67D9;

text-decoration:none;

border-radius:999px;

font-size:22px;

transition:.25s;

}

.btn:hover{

background:#F3A8C2;

transform:translateY(-2px);

}

.hint{

margin-top:18px;

font-size:17px;

color:#8A86A8;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(12px);

}

to{

opacity:1;
transform:none;

}

}

@media(max-width:768px){

body{

padding:16px;

}

.card{

padding:22px 18px;

}

h1{

font-size:30px;

}

p{

font-size:18px;

}

#message{

font-size:22px;

}

.btn{

width:100%;

max-width:260px;

display:block;

margin:auto;

}

}

</style>

</head>

<body>

<div class="blur"></div>
<div class="blur2"></div>

<div class="card">

<h1>🧩 A Piece of Love</h1>

<p>แตะรูป 2 ชิ้นเพื่อสลับตำแหน่ง 🤍</p>

<div id="board"></div>

<div class="hint">

💜 แตะรูปชิ้นแรก แล้วแตะอีกชิ้นเพื่อสลับ

</div>

<div id="message">

🎉 เก่งมากไอมุอุ้ด มาหมทีนึง! 🤍

</div>

<div class="actions">

<a id="menuBtn" class="btn" href="menu.html">

🏠 กลับหน้าเมนู

</a>
</div>
</div>
<script>

const board = document.getElementById("board");

let order = [0,1,2,3,4,5,6,7,8];

let selected = null;

let finished = false;





// ---------- สุ่ม ----------
function shuffle(){

    do{

        for(let i=order.length-1;i>0;i--){

            const j=Math.floor(Math.random()*(i+1));

            [order[i],order[j]]=[order[j],order[i]];

        }

    }while(order.every((v,i)=>v===i));

    render();

}


// ---------- แสดง Puzzle ----------
function render(){

    board.innerHTML="";

    order.forEach((piece,index)=>{

        const tile=document.createElement("div");

        tile.className="tile";

        if(selected===index){

            tile.classList.add("selected");

        }

        const x=(piece%3)*50;

        const y=Math.floor(piece/3)*50;

        tile.style.backgroundPosition=`${x}% ${y}%`;

        tile.addEventListener("click",()=>selectTile(index));

        board.appendChild(tile);

    });

}


// ---------- เลือกชิ้น ----------
function selectTile(index){

    if(finished) return;

    if(selected===null){

        selected=index;

        render();

        return;

    }

    if(selected===index){

        selected=null;

        render();

        return;

    }

    [order[selected],order[index]]=[order[index],order[selected]];

    selected=null;

    render();

    check();

}


// ---------- ตรวจว่าต่อเสร็จหรือยัง ----------
function check(){

    if(order.every((v,i)=>v===i)){

        finished=true;

        celebrate();

        document.getElementById("message").style.display="block";

        document.getElementById("menuBtn").style.display="inline-block";

    }

}


// ---------- เอฟเฟกต์โปรยหัวใจ ----------
function celebrate(){

    const icons=["🤍","🌷","✨","💜"];

    for(let i=0;i<40;i++){

        const e=document.createElement("div");

        e.textContent=icons[Math.floor(Math.random()*icons.length)];

        e.style.position="fixed";

        e.style.left=Math.random()*100+"vw";

        e.style.top="-30px";

        e.style.fontSize=(20+Math.random()*18)+"px";

        e.style.pointerEvents="none";

        e.style.zIndex="9999";

        e.style.transition="transform 3s linear, opacity 3s";

        document.body.appendChild(e);

        requestAnimationFrame(()=>{

            e.style.transform=`translateY(${window.innerHeight+100}px) rotate(${Math.random()*720}deg)`;

            e.style.opacity="0";

        });

        setTimeout(()=>e.remove(),3000);

    }

}

shuffle();

</script>
</body>
</html>
